[package]
name = "muster-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "x11", "wayland", "clipboard"] }
# Starship's default symbols (📦, 🦀, 🐍) and agents' output use emoji, which
# no Nerd Font has; this bundles Noto Emoji, as keel does.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
muster-core = { version = "0.1.0", path = "../muster-core" }
# config.toml: read with toml, rewritten with toml_edit so the user's
# comments and the daemon's sections survive the app saving its own.
toml = "1.2"
toml_edit = "0.25"
# Markdown for the live preview beside the editor.
pulldown-cmark = { version = "0.13", default-features = false }
# Native folder and file pickers, as keel uses.
rfd = "0.17"
# URL and path detection in terminal output; already in the tree.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Same version egui already pulls in; validates and scans font files.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
vt100 = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Window background blur; both already come in through winit.
objc2 = "0.6.5"
raw-window-handle = "0.6.2"

# The renderer: wgpu (Metal on macOS) by default; `--no-default-features
# --features glow` builds an OpenGL one instead.
[features]
default = ["wgpu"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]
