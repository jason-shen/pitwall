# First-run welcome and tour.
"Welcome to Pitwall" = "Willkommen bei Pitwall"
"Pick a language. You can change it later in Settings." = "Wähle eine Sprache. Du kannst sie später in den Einstellungen ändern."
"Want a quick look at where things are?" = "Kurz zeigen, wo was ist?"
"Show me around" = "Zeig's mir"
"Skip" = "Überspringen"
"{n} of {m}" = "{n} von {m}"
"Next" = "Weiter"
"Back" = "Zurück"
"Done" = "Fertig"
"Skip tour" = "Tour überspringen"
"Remotes" = "Remotes"
"Keys" = "Keys"
"Search or start anything" = "Suchen oder loslegen"
"Find a project, terminal or file, or type a task and press Enter to start an agent on it. {key} opens this from anywhere." = "Finde ein Projekt, ein Terminal oder eine Datei, oder tippe eine Aufgabe und drücke Enter, damit ein Agent sie übernimmt. {key} öffnet das von überall."
"Projects, Remotes and Keys" = "Projekte, Remotes und Keys"
"Projects lists your folders and what runs in each. Remotes keeps your SSH servers, in groups. Keys holds API keys, encrypted behind a password." = "Projekte zeigt deine Ordner und was in jedem läuft. Remotes sammelt deine SSH-Server in Gruppen. Keys verwahrt API-Keys, verschlüsselt hinter einem Passwort."
"Your projects" = "Deine Projekte"
"Each project folds open to its agents and terminals. Click one to bring it up; + opens another folder." = "Jedes Projekt klappt zu seinen Agents und Terminals auf. Ein Klick holt es nach vorn; + öffnet einen weiteren Ordner."
"Every agent in every project and remote, with what it's doing. One turns amber when it needs an answer or wants to run a command." = "Jeder Agent in jedem Projekt und auf jedem Remote, mit dem, woran er gerade arbeitet. Er wird orange, wenn er eine Antwort braucht oder einen Befehl ausführen will."
"The open project's terminals and agents, with Files and Changes at the end. Drag a tab onto the stage to tile it beside another." = "Terminals und Agents des offenen Projekts, am Ende Dateien und Änderungen. Zieh einen Tab auf die Bühne, um ihn neben einen anderen zu kacheln."
"The stage" = "Die Bühne"
"Terminals and agents tile here. Drag a card by its title to swap it; drag the gap between cards to resize, double-click it to even them out." = "Hier werden Terminals und Agents gekachelt. Zieh eine Karte am Titel, um sie zu tauschen; zieh die Lücke zwischen Karten, um die Größe zu ändern, und doppelklicke sie, um alles anzugleichen."
"Settings and shortcuts" = "Einstellungen und Kurzbefehle"
"Language, fonts, colours and the editor are in Settings ({settings}); Shortcuts ({shortcuts}) lists every key. The green dot is the daemon, which keeps agents running after you close the window." = "Sprache, Schriften, Farben und Editor findest du in den Einstellungen ({settings}); Kurzbefehle ({shortcuts}) listet jede Taste. Der grüne Punkt ist der Daemon, der Agents weiterlaufen lässt, wenn du das Fenster schließt."
"No projects yet. + opens a folder; agents and terminals you start show up here." = "Noch keine Projekte. + öffnet einen Ordner; gestartete Agents und Terminals erscheinen hier."

# Agents started in terminals get worktrees.
"• Merge {branch} into" = "• {branch} zusammenführen in"
"{id}'s work is merged. Remove its worktree and branch?\n\nThe terminal stays open; the next agent you start in it gets a fresh worktree." = "Die Arbeit von {id} ist zusammengeführt. Worktree und Branch entfernen?\n\nDas Terminal bleibt offen; der nächste Agent, den du darin startest, bekommt einen frischen Worktree."
"removed {id}'s worktree" = "Worktree von {id} entfernt"
"{name} is done: review its changes, then merge them" = "{name} ist fertig: Änderungen prüfen, dann zusammenführen"
"Commit the agent's work and merge it into a branch you pick (m)" = "Die Arbeit des Agents committen und in einen Branch deiner Wahl zusammenführen (m)"
"Remove its worktree…" = "Worktree entfernen…"
"Remove {id}'s worktree? Its branch goes too if it's merged; one that isn't is kept." = "Worktree von {id} entfernen? Der Branch geht mit, wenn er zusammengeführt ist; sonst bleibt er."
