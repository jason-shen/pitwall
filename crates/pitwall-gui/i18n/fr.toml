# First-run welcome and tour.
"Welcome to Pitwall" = "Bienvenue dans Pitwall"
"Pick a language. You can change it later in Settings." = "Choisissez une langue. Vous pourrez la changer plus tard dans les Réglages."
"Want a quick look at where things are?" = "Un petit tour pour voir où se trouve chaque chose ?"
"Show me around" = "Faire le tour"
"Skip" = "Passer"
"{n} of {m}" = "{n} sur {m}"
"Next" = "Suivant"
"Back" = "Retour"
"Done" = "Terminé"
"Skip tour" = "Passer la visite"
"Remotes" = "Distants"
"Keys" = "Clés"
"Search or start anything" = "Chercher ou lancer n'importe quoi"
"Find a project, terminal or file, or type a task and press Enter to start an agent on it. {key} opens this from anywhere." = "Trouvez un projet, un terminal ou un fichier, ou tapez une tâche et appuyez sur Entrée pour la confier à un agent. {key} ouvre ceci de partout."
"Projects, Remotes and Keys" = "Projets, Distants et Clés"
"Projects lists your folders and what runs in each. Remotes keeps your SSH servers, in groups. Keys holds API keys, encrypted behind a password." = "Projets liste vos dossiers et ce qui tourne dans chacun. Distants regroupe vos serveurs SSH. Clés conserve vos clés d'API, chiffrées derrière un mot de passe."
"Your projects" = "Vos projets"
"Each project folds open to its agents and terminals. Click one to bring it up; + opens another folder." = "Chaque projet se déplie sur ses agents et ses terminaux. Cliquez sur l'un d'eux pour l'afficher ; + ouvre un autre dossier."
"Every agent in every project and remote, with what it's doing. One turns amber when it needs an answer or wants to run a command." = "Chaque agent de chaque projet et machine distante, avec ce qu'il fait. Il passe à l'orange quand il attend une réponse ou veut lancer une commande."
"The open project's terminals and agents, with Files and Changes at the end. Drag a tab onto the stage to tile it beside another." = "Les terminaux et agents du projet ouvert, avec Fichiers et Modifications au bout. Glissez un onglet sur la scène pour le placer à côté d'un autre."
"The stage" = "La scène"
"Terminals and agents tile here. Drag a card by its title to swap it; drag the gap between cards to resize, double-click it to even them out." = "Les terminaux et agents s'y disposent en mosaïque. Glissez une carte par son titre pour l'échanger ; glissez l'espace entre deux cartes pour les redimensionner, double-cliquez dessus pour les égaliser."
"Settings and shortcuts" = "Réglages et raccourcis"
"Language, fonts, colours and the editor are in Settings ({settings}); Shortcuts ({shortcuts}) lists every key. The green dot is the daemon, which keeps agents running after you close the window." = "Langue, polices, couleurs et éditeur sont dans les Réglages ({settings}) ; Raccourcis ({shortcuts}) liste toutes les touches. Le point vert est le daemon, qui fait tourner les agents même fenêtre fermée."
"No projects yet. + opens a folder; agents and terminals you start show up here." = "Pas encore de projet. + ouvre un dossier ; les agents et terminaux que vous lancez apparaissent ici."

# Agents started in terminals get worktrees.
"• Merge {branch} into" = "• Fusionner {branch} dans"
"{id}'s work is merged. Remove its worktree and branch?\n\nThe terminal stays open; the next agent you start in it gets a fresh worktree." = "Le travail de {id} est fusionné. Supprimer son worktree et sa branche ?\n\nLe terminal reste ouvert ; le prochain agent que vous y lancez aura un nouveau worktree."
"removed {id}'s worktree" = "worktree de {id} supprimé"
"{name} is done: review its changes, then merge them" = "{name} a terminé : relisez ses modifications, puis fusionnez-les"
"Commit the agent's work and merge it into a branch you pick (m)" = "Valider le travail de l'agent et le fusionner dans la branche de votre choix (m)"
"Remove its worktree…" = "Supprimer son worktree…"
"Remove {id}'s worktree? Its branch goes too if it's merged; one that isn't is kept." = "Supprimer le worktree de {id} ? Sa branche part aussi si elle est fusionnée ; sinon elle est gardée."
"Session" = "Session"
"New session" = "Nouvelle session"
"Resumes in the session's own folder, no new worktree" = "Reprend dans le dossier de la session, sans nouveau worktree"
"Dismiss" = "Ignorer"
"Resume" = "Reprendre"
"Types: {line}" = "Tape : {line}"
"{agent} was running here, but its session ended" = "{agent} tournait ici, mais sa session s'est terminée"
"{agent} was running here when pitwall last stopped, and stopped with it. Resume runs: {line}" = "{agent} tournait ici quand pitwall s'est arrêté la dernière fois, et s'est arrêté avec lui. Reprendre lance : {line}"
"{name} committed on {branch}: merge it into {target}?" = "{name} a fait un commit sur {branch} : le fusionner dans {target} ?"
"Merge…" = "Fusionner…"
"Commit anything left, merge the branch, then offer to remove the worktree" = "Fait un commit de ce qui reste, fusionne la branche, puis propose de supprimer le worktree"
"Committed on {branch}. Merge it into {target}?" = "Commit fait sur {branch}. Le fusionner dans {target} ?"
"{n} commit(s) on {branch} that {target} doesn't have" = "{n} commit(s) sur {branch} que {target} n’a pas"
"{branch} is merged into {target}" = "{branch} est fusionnée dans {target}"
"{branch} is already merged into {target}" = "{branch} est déjà fusionnée dans {target}"
"the agent" = "l’agent"
"{id}'s work is merged. Quit {agent} and remove its worktree and branch?\n\nThe terminal stays open; the next agent you start in it gets a fresh worktree." = "Le travail de {id} est fusionné. Quitter {agent} et supprimer son worktree et sa branche ?\n\nLe terminal reste ouvert ; le prochain agent que vous y lancez aura un nouveau worktree."
"Quit {agent} and remove {id}'s worktree? Its branch goes too if it's merged; one that isn't is kept." = "Quitter {agent} et supprimer le worktree de {id} ? Sa branche part aussi si elle est fusionnée ; sinon elle est gardée."
"Branch" = "Branche"
"Give the branch a name" = "Donne un nom à la branche"
"That isn't a valid branch name" = "Ce n’est pas un nom de branche valide"
"There's already a branch by that name" = "Une branche porte déjà ce nom"
"Name the branch" = "Nommer la branche"
"The agent starting in {term} works in its own worktree of {repo}, on a new branch." = "L’agent qui démarre dans {term} travaille dans son propre worktree de {repo}, sur une nouvelle branche."
"Create worktree" = "Créer le worktree"
"Work in the checkout" = "Travailler dans le checkout"
"The agent runs in your checkout, with no branch of its own" = "L’agent tourne dans ton checkout, sans branche à lui"
