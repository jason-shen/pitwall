# First-run welcome and tour.
"Welcome to Pitwall" = "欢迎使用 Pitwall"
"Pick a language. You can change it later in Settings." = "选择一种语言。之后可以在设置中更改。"
"Want a quick look at where things are?" = "要快速看看各个功能在哪里吗？"
"Show me around" = "带我看看"
"Skip" = "跳过"
"{n} of {m}" = "第 {n} / {m} 步"
"Next" = "下一步"
"Back" = "上一步"
"Done" = "完成"
"Skip tour" = "跳过导览"
"Remotes" = "远程"
"Keys" = "密钥"
"Search or start anything" = "搜索或开始任何事"
"Find a project, terminal or file, or type a task and press Enter to start an agent on it. {key} opens this from anywhere." = "查找项目、终端或文件，或者输入一个任务并按回车，让智能体开始处理。在任何地方按 {key} 都能打开这里。"
"Projects, Remotes and Keys" = "项目、远程和密钥"
"Projects lists your folders and what runs in each. Remotes keeps your SSH servers, in groups. Keys holds API keys, encrypted behind a password." = "项目列出你的文件夹以及每个文件夹里正在运行的内容。远程保存你的 SSH 服务器，可以分组。密钥存放 API 密钥，经过加密并受密码保护。"
"Your projects" = "你的项目"
"Each project folds open to its agents and terminals. Click one to bring it up; + opens another folder." = "每个项目展开后是它的智能体和终端。点一下就能打开；+ 可以打开另一个文件夹。"
"Every agent in every project and remote, with what it's doing. One turns amber when it needs an answer or wants to run a command." = "所有项目和远程里的每个智能体，以及它们正在做什么。智能体需要你回答或想运行命令时会变成琥珀色。"
"The open project's terminals and agents, with Files and Changes at the end. Drag a tab onto the stage to tile it beside another." = "当前项目的终端和智能体，末尾是文件和更改。把标签拖到工作区上，可以和另一个并排平铺。"
"The stage" = "工作区"
"Terminals and agents tile here. Drag a card by its title to swap it; drag the gap between cards to resize, double-click it to even them out." = "终端和智能体在这里平铺。拖动卡片标题可以交换位置；拖动卡片之间的间隙可以调整大小，双击间隙可以重新均分。"
"Settings and shortcuts" = "设置和快捷键"
"Language, fonts, colours and the editor are in Settings ({settings}); Shortcuts ({shortcuts}) lists every key. The green dot is the daemon, which keeps agents running after you close the window." = "语言、字体、配色和编辑器都在设置里（{settings}）；快捷键（{shortcuts}）列出所有按键。绿点表示守护进程，关闭窗口后它仍让智能体继续运行。"
"No projects yet. + opens a folder; agents and terminals you start show up here." = "还没有项目。+ 打开一个文件夹；你启动的智能体和终端会显示在这里。"

# Agents started in terminals get worktrees.
"• Merge {branch} into" = "• 将 {branch} 合并到"
"{id}'s work is merged. Remove its worktree and branch?\n\nThe terminal stays open; the next agent you start in it gets a fresh worktree." = "{id} 的工作已合并。要移除它的工作树和分支吗？\n\n终端会保持打开；之后在里面启动的智能体会得到一个新的工作树。"
"removed {id}'s worktree" = "已移除 {id} 的工作树"
"{name} is done: review its changes, then merge them" = "{name} 已完成：先审查它的更改，再合并"
"Commit the agent's work and merge it into a branch you pick (m)" = "提交智能体的工作，并合并到你选择的分支 (m)"
"Remove its worktree…" = "移除它的工作树…"
"Remove {id}'s worktree? Its branch goes too if it's merged; one that isn't is kept." = "移除 {id} 的工作树？已合并的分支会一并删除；未合并的会保留。"
