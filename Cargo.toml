[workspace]
resolver = "2"
members = ["crates/pitwall-core", "crates/pitwall", "crates/pitwall-gui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

# Path only: a version here would have to be bumped with every release.
[workspace.dependencies]
pitwall-core = { path = "crates/pitwall-core" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
