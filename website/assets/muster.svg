<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A prompt and three agents after it, in the app's status colours:
       working, waiting on you, done. Regenerate the .icns with `make icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e36"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Apple's grid: an 824px rounded square, with room around it for the shadow. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <path d="M248 374 l138 138 l-138 138" fill="none" stroke="#e9e7e3" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="504" cy="604" r="46" fill="#8cd05c"/>
  <circle cx="638" cy="604" r="46" fill="#f0a13c"/>
  <circle cx="772" cy="604" r="46" fill="#2bc4ae"/>
</svg>
